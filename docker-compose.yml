services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gamepicker
      POSTGRES_USER: gamepicker
      POSTGRES_PASSWORD: gamepicker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamepicker"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
